[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datons"
version = "0.6.1"
description = "Deprecated compatibility facade for Joltio Data"
requires-python = ">=3.10"
dependencies = ["joltio>=0.1.0"]

[project.scripts]
datons = "datons.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datons"]
